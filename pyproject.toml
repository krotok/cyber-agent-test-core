[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-agent-test-core"
version = "0.2.0"
description = "Reusable cross-platform test framework for Cybersecurity Agent"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Cyber Agent Test Core maintainers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10,<3",
    "packaging>=24",
    "PyYAML>=6.0,<7",
    "pytest>=8.0,<10",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.entry-points.pytest11]
cyber_agent_test_core = "cyber_agent_test_core.internal.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cyber_agent_test_core = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=cyber_agent_test_core --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "package: builds and validates an installed wheel in an isolated environment",
]

[tool.coverage.run]
branch = true
source = ["cyber_agent_test_core"]

[tool.coverage.report]
show_missing = true
skip_empty = true
