name: cyber-agent-test-core

concurrency:
  group: cyber-agent-test-core-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

on:
  pull_request:
  push:
    branches: [main, "release/**", "hotfix/**"]
    tags: ["v*.*.*", "v*.*.*rc*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version already committed to pyproject.toml and CORE_VERSION
        required: false
        type: string
      product_tests_repository:
        description: owner/repository containing the candidate compatibility suite
        required: true
        type: string
      product_tests_ref:
        description: Product-tests candidate branch, tag, or commit
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      release_version:
        required: false
        type: string
      product_tests_repository:
        required: true
        type: string
      product_tests_ref:
        required: true
        type: string
    secrets:
      product_tests_token:
        required: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: 1 - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools

  type-check:
    name: 2 - type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - run: python -m pip install --no-deps -e .
      - run: mypy src

  unit-tests:
    name: 3 - unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest tests/unit --no-cov

  integration-tests:
    name: 4 - integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest tests/integration --no-cov

  public-api-contract:
    name: 5 - public API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - run: python -m pip install --no-deps -e .
      - run: pytest tests/contract --no-cov

  security-checks:
    name: 6 - security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-wheel:
    name: 7 - build wheel, SBOM, checksum, signing
    needs: [lint, type-check, unit-tests, integration-tests, public-api-contract, security-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements/ci.lock}
      - run: python -m pip install -r requirements/ci.lock
      - id: version
        shell: bash
        run: |
          VERSION="${{ inputs.release_version }}"
          if [[ -z "$VERSION" && "${GITHUB_REF_TYPE}" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -z "$VERSION" ]]; then VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"; fi
          python tools/release.py "$VERSION" | tee release-channel.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat release-channel.txt >> "$GITHUB_OUTPUT"
      - run: python -m build --wheel --sdist --outdir dist/packages
      - name: Package checksum
        shell: bash
        run: sha256sum dist/packages/* > dist/SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/cyber-agent-test-core.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keyless artifact signing
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/packages/*.whl dist/packages/*.tar.gz dist/SHA256SUMS dist/*.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  clean-install:
    name: 8 - install wheel in clean environment
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - run: python -m venv clean-env
      - run: clean-env/bin/python -m pip install -r requirements/ci.lock
      - run: clean-env/bin/python -m pip install --no-deps dist/packages/*.whl
      - env:
          RELEASE_VERSION: ${{ needs.build-wheel.outputs.version }}
        run: clean-env/bin/python -c "import os; from cyber_agent_test_core.api import CORE_VERSION; assert CORE_VERSION == os.environ['RELEASE_VERSION']"

  package-smoke:
    name: 9 - package smoke test
    needs: [build-wheel, clean-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - run: python -m pip install -r requirements/ci.lock
      - run: python -m pip install --no-deps -e .
      - shell: bash
        run: CORE_WHEEL_PATH="$(find dist/packages -name '*.whl' -print -quit)" pytest tests/package --no-cov

  product-compatibility:
    name: 10 - product-tests framework compatibility candidate
    needs: [build-wheel, package-smoke]
    if: ${{ inputs.product_tests_repository != '' || vars.PRODUCT_TESTS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.product_tests_repository || vars.PRODUCT_TESTS_REPOSITORY }}
          ref: ${{ inputs.product_tests_ref || vars.PRODUCT_TESTS_CANDIDATE_REF || 'main' }}
          token: ${{ secrets.product_tests_token || secrets.PRODUCT_TESTS_TOKEN }}
          path: product-tests
          sparse-checkout: tests/framework_compatibility
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - run: python -m pip install -r product-tests/tests/framework_compatibility/requirements.lock
      - run: python -m pip install --no-deps dist/packages/*.whl
      - run: pytest product-tests/tests/framework_compatibility --no-cov

  publish-prerelease:
    name: 11 - publish pre-release
    needs: [build-wheel, product-compatibility]
    if: ${{ needs.build-wheel.outputs.prerelease == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/packages
          attestations: true

  publish-stable:
    name: 12 - publish stable release
    needs: [build-wheel, product-compatibility]
    if: ${{ needs.build-wheel.outputs.prerelease == 'false' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {packages-dir: dist/packages, attestations: true}

  git-tag:
    name: 13 - Git tag
    needs: [build-wheel, publish-prerelease, publish-stable]
    if: ${{ always() && (needs.publish-prerelease.result == 'success' || needs.publish-stable.result == 'success') }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Create or verify immutable release tag
        shell: bash
        run: |
          TAG="v${{ needs.build-wheel.outputs.version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "$TAG"
            git rev-parse --verify "$TAG"
          else
            git tag -a "$TAG" -m "cyber-agent-test-core ${{ needs.build-wheel.outputs.version }}"
            git push origin "$TAG"
          fi

  release-notes:
    name: 14 - release notes
    needs: [build-wheel, git-tag]
    if: ${{ always() && needs.git-tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v8
        with: {name: "release-${{ needs.build-wheel.outputs.version }}", path: dist}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          FLAGS=(--generate-notes --verify-tag)
          if [[ "${{ needs.build-wheel.outputs.prerelease }}" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "v${{ needs.build-wheel.outputs.version }}" dist/* "${FLAGS[@]}"
